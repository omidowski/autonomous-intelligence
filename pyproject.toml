[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-intelligence"
version = "0.1.0"
description = "Multi-agent research and decision-support system using Generative AI, Agentic AI and RAG."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Omid Moraveji"}]
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "openai>=3.1,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "numpy>=2.0,<3",
  "python-dotenv>=1.1,<2",
  "pillow>=10.4,<12",
  "moviepy>=2.0,<3",
  "imageio-ffmpeg>=0.5,<1",
  "python-multipart>=0.0.12,<1",
  "stripe>=11.1,<12",
  "flask>=3.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "httpx>=0.27,<1",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autonomous_intelligence"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]
